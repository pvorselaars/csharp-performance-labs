name: perf-gate
on:
  pull_request:
    paths: ['src/**', 'solutions/**', 'labs/**', 'specializations/**', 'Directory.Build.props']
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Performance gate
        shell: pwsh
        run: ./scripts/perf-gate.ps1
        env:
          PERFLAB_NO_SCALE: '0'
