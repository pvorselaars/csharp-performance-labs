name: perf-gate
on:
  pull_request:
    paths: ['src/**', 'solutions/**', 'labs/**', 'specializations/**', 'Directory.Build.props', 'scripts/perf-gate.ps1']
jobs:
  gate:
    name: gate (${{ matrix.prefix }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let every lab report; one noisy lab must not hide the others
      matrix:
        prefix: [L00, L01, L02, L03, L04, L05, L06, L07, L08, L09, L10, L11, L12, L13, L14, S-DB01]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Performance gate
        shell: pwsh
        run: ./scripts/perf-gate.ps1 ${{ matrix.prefix }}
        env:
          PERFLAB_NO_SCALE: '0'
